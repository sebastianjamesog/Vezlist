spring:
  application:
    name: vezlist-api
  # Loads local developer secrets from Backend/.env when present. The file is
  # ignored by Git; deployed environments must inject these variables through
  # their platform's secret manager instead.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${VEZLIST_DB_URL}
    username: ${VEZLIST_DB_USERNAME}
    password: ${VEZLIST_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 12h

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

vezlist:
  cors:
    allowed-origins: ${VEZLIST_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  storage:
    endpoint: ${VEZLIST_STORAGE_ENDPOINT:http://localhost:9000}
    region: ${VEZLIST_STORAGE_REGION:us-east-1}
    bucket: ${VEZLIST_STORAGE_BUCKET:vezlist-media}
    access-key: ${VEZLIST_MINIO_ROOT_USER:${VEZLIST_STORAGE_ACCESS_KEY:local-minio}}
    secret-key: ${VEZLIST_MINIO_ROOT_PASSWORD:${VEZLIST_STORAGE_SECRET_KEY:local-minio-secret}}
    upload-url-ttl: ${VEZLIST_STORAGE_UPLOAD_URL_TTL:PT10M}
    download-url-ttl: ${VEZLIST_STORAGE_DOWNLOAD_URL_TTL:PT15M}
    max-image-bytes: ${VEZLIST_STORAGE_MAX_IMAGE_BYTES:10485760}
  discovery:
    query-timeout-ms: ${VEZLIST_DISCOVERY_QUERY_TIMEOUT_MS:3000}
  # Dev-only admin account seeding (see cc.vezlist.identity.application.AdminAccountSeeder).
  # There is no separate "prod" Spring profile in this project yet, so this defaults to
  # true for local development convenience but MUST be set to false via the
  # VEZLIST_SEED_ADMIN environment variable in every deployed environment.
  seed-admin: ${VEZLIST_SEED_ADMIN:true}
  seed-admin-password: ${VEZLIST_SEED_ADMIN_PASSWORD:Vezlist#Admin2026}

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
