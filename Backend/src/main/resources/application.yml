spring:
  application:
    name: vezlist-api
  # Loads local developer secrets from Backend/.env when present. The file is
  # ignored by Git; deployed environments must inject these variables through
  # their platform's secret manager instead.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${VEZLIST_DB_URL}
    username: ${VEZLIST_DB_USERNAME}
    password: ${VEZLIST_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 12h

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

vezlist:
  cors:
    allowed-origins: ${VEZLIST_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
