spring:
  data:
    redis:
      host: ${VEZLIST_REDIS_HOST:localhost}
      port: ${VEZLIST_REDIS_PORT:6379}
      password: ${VEZLIST_REDIS_PASSWORD:}
      timeout: 2s
  application:
    name: vezlist-api
  # Loads local developer secrets from Backend/.env when present. The file is
  # ignored by Git; deployed environments must inject these variables through
  # their platform's secret manager instead.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${VEZLIST_DB_URL}
    username: ${VEZLIST_DB_USERNAME}
    password: ${VEZLIST_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 12h

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

vezlist:
  live:
    demo-purchases-enabled: ${VEZLIST_LIVE_DEMO_PURCHASES_ENABLED:false}
    gcore-api-token: ${VEZLIST_GCORE_API_TOKEN:}
    broadcast-ws-url: ${VEZLIST_LIVE_BROADCAST_WS_URL:ws://localhost:8080/api/v1/live/broadcast}
    chat-ws-url: ${VEZLIST_LIVE_CHAT_WS_URL:ws://localhost:8080/api/v1/live/chat}
    ffmpeg-path: ${VEZLIST_FFMPEG_PATH:ffmpeg}
    max-broadcasts-per-node: ${VEZLIST_LIVE_MAX_BROADCASTS_PER_NODE:4}
    max-chat-connections-per-node: ${VEZLIST_LIVE_MAX_CHAT_CONNECTIONS_PER_NODE:2000}
  stories:
    demo-purchases-enabled: ${VEZLIST_STORY_DEMO_PURCHASES_ENABLED:false}
  cors:
    allowed-origins: ${VEZLIST_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3100,http://localhost:3101,http://localhost:3102}
    allow-local-patterns: ${VEZLIST_CORS_ALLOW_LOCAL_PATTERNS:false}
  storage:
    endpoint: ${VEZLIST_STORAGE_ENDPOINT:http://localhost:9000}
    region: ${VEZLIST_STORAGE_REGION:us-east-1}
    bucket: ${VEZLIST_STORAGE_BUCKET:vezlist-media}
    access-key: ${VEZLIST_MINIO_ROOT_USER:${VEZLIST_STORAGE_ACCESS_KEY:local-minio}}
    secret-key: ${VEZLIST_MINIO_ROOT_PASSWORD:${VEZLIST_STORAGE_SECRET_KEY:local-minio-secret}}
    upload-url-ttl: ${VEZLIST_STORAGE_UPLOAD_URL_TTL:PT10M}
    download-url-ttl: ${VEZLIST_STORAGE_DOWNLOAD_URL_TTL:PT15M}
    max-image-bytes: ${VEZLIST_STORAGE_MAX_IMAGE_BYTES:10485760}
  discovery:
    query-timeout-ms: ${VEZLIST_DISCOVERY_QUERY_TIMEOUT_MS:3000}
  # Opt-in local admin seeding (see cc.vezlist.identity.application.AdminAccountSeeder).
  seed-admin: ${VEZLIST_SEED_ADMIN:false}
  seed-admin-password: ${VEZLIST_SEED_ADMIN_PASSWORD:}

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
