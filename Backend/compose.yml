services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${VEZLIST_DB_NAME:-vezlist}
      POSTGRES_USER: ${VEZLIST_DB_USERNAME:?Set VEZLIST_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${VEZLIST_DB_PASSWORD:?Set VEZLIST_DB_PASSWORD in .env}
    ports:
      # Port 5432 is commonly occupied by a locally installed PostgreSQL.
      # Keep Docker's database isolated on 5433 while PostgreSQL remains 5432 inside the container.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vezlist -d vezlist"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${VEZLIST_MINIO_ROOT_USER:?Set VEZLIST_MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${VEZLIST_MINIO_ROOT_PASSWORD:?Set VEZLIST_MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
